<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>discount calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="calculator">
      <div class="header">
        <div class="form">
          <label for="bill" class="input-group">
            <p>
              BILL AMOUNT
            </p>
            <input type="number" id="bill">
          </label>
          <label for="percentage">
            <p>DISCOUNT PERCENTAGE</p>
            <input type="number" id="discount">
          </label>
          <button class="calculate" onclick="calculatediscount()">
            CALCULATE
          </button>
        </div>
        <div class="result-box " id="result-discount">
          <div class="result-discount">
            <p>YOUR DISCOUNT WILL APPEAR HERE</p>
          </div>
          <div class="result-total" id="result-total">
            <p>YOUR TOTAL WILL APPEAR HERE</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
